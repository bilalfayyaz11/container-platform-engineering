name: compose-network-isolation

services:
  proxy:
    image: nginx:1.29-alpine
    container_name: network-proxy
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      frontend-net:
        ipv4_address: 172.30.10.10
      backend-net:
        ipv4_address: 172.30.20.10
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/nginx-health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: compose-network-api:1.0.0
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      LOG_LEVEL: INFO
    secrets:
      - postgres_password
      - redis_password
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      backend-net:
        ipv4_address: 172.30.20.20
      data-net:
        ipv4_address: 172.30.30.20
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    init: true

  db:
    image: postgres:17-alpine
    container_name: network-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      data-net:
        ipv4_address: 172.30.30.30
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  cache:
    image: redis:8-alpine
    container_name: network-cache
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --appendonly yes \
          --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      data-net:
        ipv4_address: 172.30.30.40
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

networks:
  frontend-net:
    name: compose-frontend-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1

  backend-net:
    name: compose-backend-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
          gateway: 172.30.20.1

  data-net:
    name: compose-data-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.30.0/24
          gateway: 172.30.30.1

volumes:
  postgres-data:
    name: compose-postgres-data

  redis-data:
    name: compose-redis-data

secrets:
  postgres_password:
    file: ./secrets/postgres-password.txt

  redis_password:
    file: ./secrets/redis-password.txt
