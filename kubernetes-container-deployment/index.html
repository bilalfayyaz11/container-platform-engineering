<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Container Deployment - Version 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef8f0;
            margin: 40px;
        }

        .container {
            max-width: 760px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #198754;
        }

        .version {
            display: inline-block;
            padding: 5px 10px;
            background: #198754;
            color: white;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kubernetes Container Deployment <span class="version">v2.0</span></h1>
        <p>This version was deployed through a Kubernetes rolling update.</p>
    </div>
</body>
</html>
