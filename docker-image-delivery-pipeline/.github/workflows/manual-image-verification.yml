name: Manual Image Verification

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to verify
        required: true
        default: latest
        type: string

      environment:
        description: Verification environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull requested image
        run: |
          docker pull \
            "${{ secrets.DOCKER_USERNAME }}/container-delivery-api:${{ inputs.image_tag }}"

      - name: Start container
        run: |
          docker run -d \
            --name manual-image-verification \
            --publish 3000:3000 \
            --env NODE_ENV="${{ inputs.environment }}" \
            --env APP_VERSION="${{ inputs.image_tag }}" \
            "${{ secrets.DOCKER_USERNAME }}/container-delivery-api:${{ inputs.image_tag }}"

      - name: Verify health
        run: |
          for attempt in $(seq 1 30); do
            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}unavailable{{end}}' \
              manual-image-verification)

            echo "Attempt ${attempt}: ${STATUS}"

            if [ "${STATUS}" = "healthy" ]; then
              curl --fail http://127.0.0.1:3000
              curl --fail http://127.0.0.1:3000/health
              exit 0
            fi

            sleep 2
          done

          docker logs manual-image-verification
          exit 1

      - name: Clean container
        if: always()
        run: |
          docker rm -f manual-image-verification 2>/dev/null || true
