name: Container Security

on:
  push:
    branches:
      - main
    paths:
      - "docker-image-delivery-pipeline/**"
      - ".github/workflows/container-security.yml"

  pull_request:
    branches:
      - main
    paths:
      - "docker-image-delivery-pipeline/**"
      - ".github/workflows/container-security.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  filesystem-scan:
    name: Source and Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Scan repository files
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: docker-image-delivery-pipeline
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  image-scan:
    name: Container Image Scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Scan published container image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/container-delivery-api:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload security results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
