<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Swarm Orchestration - Version 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #e8f5e9;
        }

        .container {
            max-width: 760px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #2e7d32;
        }

        .version {
            display: inline-block;
            padding: 5px 10px;
            background: #2e7d32;
            color: white;
            border-radius: 4px;
        }

        .info {
            margin-top: 20px;
            padding: 18px;
            background: #f1f8e9;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Docker Swarm Orchestration <span class="version">v2.0</span></h1>

        <div class="info">
            <p><strong>Service:</strong> Nginx web frontend</p>
            <p><strong>Stack:</strong> webstack</p>
            <p><strong>Deployment:</strong> Rolling update</p>
            <p><strong>Status:</strong> Updated successfully</p>
        </div>

        <p>
            This version demonstrates controlled service updates in Docker Swarm.
        </p>
    </div>
</body>
</html>
